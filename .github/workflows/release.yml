name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pillow numpy

      - name: Build Standalone Executable
        run: |
          python -m PyInstaller DeadlockForge.spec --noconfirm

      - name: Prepare Release Asset
        shell: pwsh
        run: |
          if (Test-Path "dist\DeadlockForge.exe") {
            Copy-Item "dist\DeadlockForge.exe" "dist\DeadlockPlus.exe"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/DeadlockPlus.exe
            dist/DeadlockForge.exe
          draft: false
          prerelease: false
          generate_release_notes: true
