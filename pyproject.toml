[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlockforge"
version = "1.2.0"
description = "Local tactical assistant, matchup analyzer and build lab for Valve Deadlock"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pywebview>=5.0",
    "vpk>=1.4",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: tests hitting real external services (LLM router); slow, run explicitly with -m live",
]
addopts = "-m 'not live'"
