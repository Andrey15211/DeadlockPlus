<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadlock Plus Overlay</title>
<style>
  :root {
    --ink: #0A0E15;
    --surface: #131926;
    --hair: rgba(255, 255, 255, 0.10);
    --text: #E8ECF3;
    --muted: #8B95A6;
    --amber: #E8B44A;
    --mint: #5FD3A0;
    --display: Bahnschrift, "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --num: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: var(--body);
    color: var(--text);
    pointer-events: none;   /* клики всегда уходят в игру */
    user-select: none;
  }

  #stack {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 6px;
  }

  .toast {
    display: grid;
    grid-template-columns: 3px auto;
    gap: 10px;
    align-items: center;
    width: 100%;
    padding: 8px 13px 8px 10px;
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 7px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
    animation: toast-in 200ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  .toast .edge { align-self: stretch; border-radius: 2px; background: var(--amber); }
  .toast.now .edge { background: var(--mint); }

  .toast .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .toast .head {
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--display); font-size: 10.5px; letter-spacing: 0.7px;
    text-transform: uppercase; color: var(--amber);
  }
  .toast.now .head { color: var(--mint); }
  .toast .head time { font-family: var(--num); font-size: 10.5px; color: var(--muted); letter-spacing: 0; }
  .toast .text {
    font-size: 13px; line-height: 1.3; color: var(--text);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .toast { animation-duration: 1ms; }
  }
</style>
</head>
<body>
<div id="stack" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';

  // Окно само не опрашивает сервер: WebView2 троттлит таймеры, и плашка
  // опаздывала бы. Драйвер в run_desktop.py зовёт window.dfToast(...) из Python.
  const stack = document.getElementById('stack');
  const MAX_TOASTS = 2;

  function fmt(sec) {
    const s = Math.max(0, Math.round(sec));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }

  window.dfToast = function (kind, title, text, at) {
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'now' ? ' now' : '');

    const edge = document.createElement('div');
    edge.className = 'edge';

    const body = document.createElement('div');
    body.className = 'body';

    const head = document.createElement('div');
    head.className = 'head';
    const label = document.createElement('span');
    label.textContent = title;
    const time = document.createElement('time');
    time.textContent = fmt(at);
    head.append(label, time);

    const line = document.createElement('div');
    line.className = 'text';
    line.textContent = text;

    body.append(head, line);
    el.append(edge, body);
    stack.appendChild(el);

    while (stack.children.length > MAX_TOASTS) stack.removeChild(stack.firstChild);
    return true;
  };

  window.dfClear = function () {
    stack.textContent = '';
    return true;
  };
})();
</script>
</body>
</html>
